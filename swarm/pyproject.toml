[project]
name = "swarm-bench"
version = "0.1.0"
description = "Measure how many coding-agent instances a machine can run at once, on your own tasks, with verifiable results."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
swarm = "swarm.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swarm"]
