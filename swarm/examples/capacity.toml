question = "How many concurrent Ante instances, each in its own sandbox, can one 2 vCPU / 8 GB machine run while still finishing verified work, and does every wave wind down cleanly?"
primary_outcome = "successes_per_minute"
model = { source = "scripted", id = "swarm-scripted-1", effort = "medium", max_output_tokens = 16384 }
harnesses = ["ante"]
tasks = ["../tasks/csv-totals", "../tasks/cli-validate"]
sandbox = "process"
seed = 41
stop_rule = "Double concurrency from 1 to 1024; stop when a wave passes under 95%, any launch is never admitted, or fewer than half the instances could run at once."

[ramp]
start = 1
factor = 2
max = 1024
stop_pass_rate = 0.95

[budget]
max_requests_per_attempt = 40
attempt_timeout_s = 180

[admission]
reserve_mb = 512
max_pressure = "warn"
wait_timeout_s = 180

[harness_options.ante]
telemetry = "on"
telemetry_env = "swarm-bench-capacity"
