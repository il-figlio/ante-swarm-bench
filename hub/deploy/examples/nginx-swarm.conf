# Example nginx locations for the swarm hub. Placeholders only:
#   swarm.example.com           the public host name
#   127.0.0.1:8003              swarm hub (SWARM_HUB_PORT)
#   /etc/nginx/swarm-*.conf     small include files that hold the ingress secrets (mode 600, never in git)
#
# Identity: these examples assume an authenticating HTTPS proxy in front of nginx (exe.dev's proxy sets
# X-ExeDev-Email for a signed-in visitor and strips a client-supplied one). If you terminate TLS yourself,
# put your own SSO in front (auth_request) and set the identity header from its answer instead.
#
# nginx picks the longest matching prefix: /swarm/public/ and /swarm/console/ first, then every other /swarm/ path.

# --- Hub: public, unauthenticated, read-only receipts ------------------------------------------------------
location ^~ /swarm/public/ {
    proxy_pass http://127.0.0.1:8003;
    proxy_set_header Host $host;
    proxy_set_header X-Swarm-Ingress "";      # public paths never carry the secret or an identity
    proxy_set_header X-ExeDev-Email "";
    proxy_set_header X-ExeDev-UserID "";
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 15s;
}

# --- Hub: owner console at /swarm/console/ ------------------------------------------------------------------
# The page fetches relative URLs (api/runs, api/status), so it works under any prefix the rewrite maps to /swarm/.
location = /swarm/console { return 308 https://swarm.example.com/swarm/console/; }
location ^~ /swarm/console/ {
    # Read-only mode: refuse anything that could start, cancel or kill a run. Drop this line to allow control.
    if ($request_method !~ ^(GET|HEAD)$) { return 409; }
    rewrite ^/swarm/console/(.*)$ /swarm/$1 break;
    include /etc/nginx/swarm-hub-ingress.conf;           # proxy_set_header X-Swarm-Ingress "<SWARM_INGRESS_TOKEN>";
    proxy_pass http://127.0.0.1:8003;
    proxy_set_header Host $host;
    proxy_set_header X-ExeDev-Email $http_x_exedev_email; # identity from the authenticating proxy
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 15s;
}

# --- Hub: everything else under /swarm/ (legacy console paths, /swarm/healthz) -----------------------------
location ^~ /swarm/ {
    if ($request_method !~ ^(GET|HEAD)$) { return 409; }
    include /etc/nginx/swarm-hub-ingress.conf;
    proxy_pass http://127.0.0.1:8003;
    proxy_set_header Host $host;
    proxy_set_header X-ExeDev-Email $http_x_exedev_email;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 15s;
}
