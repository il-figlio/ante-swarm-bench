name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  suites:
    name: suites (${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        shard: [other, maze-play]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run benchmark test suites
        env:
          SHARD: ${{ matrix.shard }}
        run: bash tests/run-all.sh profile "$SHARD"

  test:
    needs: suites
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require both suites to pass
        env:
          RESULT: ${{ needs.suites.result }}
        run: test "$RESULT" = success
